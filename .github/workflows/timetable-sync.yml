# スクールバス時刻表の自動取り込み（要件定義 §10 の確定 YAML）
#
# 取得から本番反映までを自動で行い、利用者に影響する変更があったときだけメールで通知する。
# 過去日の管理 override 剪定だけの定期保守は、更新メールの対象に含めない。
# 人間の PR レビューは経由しない（2026-08-16 の方針転換。要件定義 §1.1 / FR-11 が正本）。
#
# 現状: このワークフローは GitHub UI で【有効化済み・稼働中】（2026-09-01 に確認）。
#   毎日 07:00 JST の自動実行で main へ直接コミットが積まれている。
#   ※ とはいえ GitHub 上の有効状態・main の実 SHA・Secrets はリポジトリ内の
#     コメントだけでは断定できない外部状態。疑わしいときは必ず GitHub UI で現物を確認すること。
# 稼働させた際の手順（すでに完了済み。再設定が必要になった場合の参考。詳細は bot/fixtures/_planning/HANDOFF.md）:
#   1. Settings → Secrets and variables → Actions に次を登録
#        GEMINI_API_KEY  … OCR 用（H-2）
#        MAIL_USERNAME   … 送信元 Gmail アドレス
#        MAIL_PASSWORD   … Gmail のアプリパスワード（16文字・スペースなし）
#        MAIL_TO         … 通知の宛先（カンマ区切りで複数可）
#   2. Settings → Actions → General → Workflow permissions を
#      「Read and write permissions」にする（main へ push するため）
#      ※「Allow GitHub Actions to create and approve pull requests」は【不要】。
#        PR を作らなくなったため。
#   3. Actions タブでこのワークフローを Enable
#
# action は full commit SHA で固定する（可変タグは移動・侵害され得る。GitHub の
# Secure use reference が full-length SHA のみを immutable としている）。
# 更新するときは同じ手順で SHA を引き直し、末尾コメントのバージョンも合わせること。

name: timetable-sync

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST（UTC+9）。GitHub の cron は遅延し得る
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（何も変更せず計画のみログ出力。メールも送らない）'
        type: boolean
        default: false

concurrency:
  group: timetable-sync
  cancel-in-progress: false # 多重起動防止（前の実行を待つ）

# main へ直接コミットするため contents: write が要る。
# PR を作らなくなったので pull-requests は不要。
# 解析ステップ自体は書き込み不要なので、checkout の資格情報を後続ステップへ残さず
# （persist-credentials: false）、push するステップの中だけで remote に token を差す。
#
# 【残存リスクとして受容】permissions は job 単位でしか付けられないため、
# contents: write はこの job の全ステップ・全 action に効く。push 専用の job へ
# 分離すれば境界を狭められるが、作業ツリー（Bot が書いた public/data）を artifact
# 経由で受け渡す必要があり、複雑さに見合わないと判断した。
# 緩和として次を置いている。
#   - 外部 action は full SHA 固定、fork/PR からは起動しない、runner は実行ごとに破棄される
#   - checkout は資格情報を残さない。token は Commit and push ステップの中だけで remote に差し、
#     途中で失敗・キャンセルしても trap で必ず戻す
#   - npm ci は install スクリプトを実行しない（--ignore-scripts）
#   - Commit and push ステップでは git hook を無効にする（.git/hooks 経由で token を読ませない）
#   - commit するのは Bot の書込み対象（bot/src/files.ts と同じ許可リスト）だけで、
#     それ以外のファイルに差分があれば何も push せずに失敗する
#   - ref 名などの式は run へ直接埋め込まず env 経由で渡す
# ただし、これらは同じ job 内での緩和にとどまる。hosted runner では sudo が使えるため、
# job 内で任意のコードを実行できる攻撃者（侵害された依存など）は、~/.gitconfig や
# git 本体の差し替えなどでこれらを迂回し得る。本当の境界は push 専用 job への分離である。
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bot/src/config.ts の runDeadlineMs（15分）と対。OCR は締切前に打ち切る
    env:
      TZ: Asia/Tokyo
    steps:
      # 手動実行では ref を自由に選べる。このワークフローは `HEAD:main` を push するため、
      # main 以外の ref で走らせると **Bot が作った差分だけでなく、その ref に既にある
      # コミットまで main へ運んでしまう**。ドライラン（何も書かない）以外は明示的に止める。
      # ref 名は env 経由で渡す。run の中へ式を直接埋め込むと、Actions がシェルに渡す前に
      # 文字列として置き換えるため、ref 名に含まれる $(...) がコマンドとして実行される。
      - name: Guard ref
        if: ${{ inputs.dry_run != true && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::main 以外の ref では実行できません（現在: ${REF}）。"
          echo "選んだ ref の既存コミットまで main へ運んでしまうためです。"
          echo "ブランチで試すときは dry_run を有効にしてください。"
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # 既定の true は git の資格情報を .git/config に残し、後続ステップ（npm ci や
          # Bot 本体）から repository write token に到達できてしまう。
          # push する Commit & push ステップは自前で remote に token を差すのでこれで問題ない。
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      # 依存の install 時スクリプト（preinstall / postinstall など）は実行しない。
      # サプライチェーン攻撃で最もよく使われる経路を塞ぐ。install スクリプトを持つ依存
      # （esbuild・protobufjs・@google/genai）は、どれも動作に必須の処理をしていない。
      # 実行時に読み込む依存のコードは引き続き実行される点に注意。
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: bot

      - name: Run sync
        id: sync
        run: npx tsx src/index.ts
        working-directory: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}

      # 人間の PR レビューが無くなったぶん、適用前にリポジトリの検証器を通す。
      # ここで落とせば壊れたデータはコミットされず、本番は前の状態のまま残る。
      # scripts/validate-data.mjs は Node 標準モジュールだけで動くので npm ci は要らない。
      - name: Validate data
        id: validate
        if: ${{ inputs.dry_run != true }}
        run: node scripts/validate-data.mjs

      # commit と通知の判断材料。対象パスを限定するのが要点で、
      # gitignore 下の bot/.out や無関係な変更を巻き込まない。
      # ここでは public/data 全体を見る。news.json など Bot の書込み対象外のファイルが
      # 変わった場合も changed=true になり、Commit and push ステップの許可リスト検査で失敗する。
      #
      # 前日までの override を calendar_rules.json から落とすだけの差分は、
      # 今日以降にアプリが選ぶ時刻表を変えない定期保守なので更新メールを送らない。
      # ただし Bot 側の判定だけを信用せず、実際の public/data 差分が calendar_rules.json
      # だけであることも確認する。他のファイルが1件でも変われば通知対象に倒す。
      - name: Detect diff
        id: diff
        if: ${{ inputs.dry_run != true }}
        env:
          CALENDAR_CLEANUP_ONLY: ${{ steps.sync.outputs.calendar_cleanup_only }}
        run: |
          status=$(git -c core.quotepath=false status --porcelain -- public/data bot/state.json bot/holidays.json)
          if [ -z "$status" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "リポジトリに差分はありません。"
            exit 0
          fi
          echo "$status"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          data_status=$(git -c core.quotepath=false status --porcelain -- public/data)
          non_calendar_data=$(printf '%s\n' "$data_status" | cut -c4- | grep -v '^public/data/calendar_rules\.json$' || true)
          if [ "$CALENDAR_CLEANUP_ONLY" = "true" ] && [ -z "$non_calendar_data" ]; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "public/data の差分は過去日の override 剪定だけです。更新メールの対象外とします。"
          elif [ -n "$data_status" ]; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        id: push
        # ref のガードは先頭ステップにもあるが、push だけは条件を二重に持つ
        # （このステップだけが main を書き換える）
        if: ${{ inputs.dry_run != true && steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # npm ci や Bot 本体は .git/hooks に任意の hook を置ける。このステップは GH_TOKEN を
          # 持つので、ステップ内のすべての git 呼び出しで hook を無効にする。
          # GIT_CONFIG_* はコマンドライン（-c）と同じ最優先の設定で、.git/config に書かれず、
          # .git/config の include で上書きされない。git add も post-index-change hook を
          # 起こすため、コマンドごとの -c ではなくステップ全体に効かせる（git 2.31 以降）。
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null

          # Bot が書いてよいファイルだけを通す許可リスト。bot/src/files.ts の WRITABLE_PATTERNS・
          # DELETABLE_PATTERNS と、bot/src/config.ts の calendarRulesPath / statePath /
          # holidaysCachePath に一致させる。files.ts を変えたらここも合わせる
          # （bot/test/workflow-guard.test.ts が食い違いを検出する）。
          # news.json・_examples・timetable_closed / special / vacation_obon は人が管理するので含めない。
          ALLOWED_PATHS_RE='^(public/data/calendar_rules\.json|public/data/timetables/timetable_(weekday|holiday|vacation_(spring|summer|winter)_(weekday|holiday)|event_[0-9]{8})\.json|bot/state\.json|bot/holidays\.json)$'

          # 標準入力のパス一覧に許可外が 1 件でもあれば失敗する。
          # core.quotepath が既定のままなので、非 ASCII や制御文字を含むパスは引用符付きで
          # 出力され、許可リストに一致せず拒否される。
          check_paths() {
            local bad
            bad=$(grep -vE "$ALLOWED_PATHS_RE" || true)
            if [ -n "$bad" ]; then
              echo "::error::Bot の書込み対象外のファイルが変更されています。push しません。"
              printf '%s\n' "$bad"
              return 1
            fi
            return 0
          }

          # rebase 後の tree を検証し直すための共通処理。
          # 個別に検証済みでも「Bot の差分 + main の新しい変更」の組合せは未検証なので、
          # 同じ検証器と同じ範囲チェックをもう一度通してから push する。
          verify_tree() {
            local base="$1"
            if ! node scripts/validate-data.mjs; then
              echo "::error::rebase 後のデータ検証に失敗しました。push しません。"
              return 1
            fi
            local changed
            # --no-renames: 改名として検出されると元のパス（例: _examples/ 側の削除）が一覧から消える
            changed=$(git diff --name-only --no-renames "$base" HEAD)
            if [ -z "$changed" ]; then
              echo "::error::rebase 後の変更が空です。push しません。"
              return 1
            fi
            if ! printf '%s\n' "$changed" | check_paths; then
              echo "::error::rebase 後の変更範囲が想定外です。push しません。"
              return 1
            fi
            return 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3 つの根をステージしてから、ステージ内容が許可リストに収まるかを検査する。git add -A は使わない。
          # pathspec で対象を絞らないのは、シェルの glob では削除済みの event ファイルが展開されず、
          # git の pathspec の timetable_*.json は closed / special / obon にも一致してしまうため。
          # 対象外のファイルに差分があれば、正当な更新も含めて何も commit せずに失敗する
          # （Bot はそれらを書かない設計なので、侵害か不具合の兆候として扱う。❌ メールで通知される）。
          git add -- public/data bot/state.json bot/holidays.json
          if git diff --cached --quiet; then
            echo "ステージされた差分がありません。コミットしません。"
            exit 0
          fi
          if ! git diff --cached --name-only --no-renames | check_paths; then
            exit 1
          fi
          git commit -m "bot: 時刻表データの自動更新 ($(date +%Y-%m-%d))"

          # token はこのステップの中だけで remote に差し、どの経路で抜けても必ず戻す。
          # set -e で途中終了しても EXIT trap は走る。INT / TERM（キャンセル）は exit に変換して
          # EXIT trap を通す。token が .git/config に残ると、後続の upload-artifact や
          # メール送信の action から読めてしまう（SIGKILL だけは戻せないが、そのとき後続ステップも走らない）。
          restore_remote() {
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" || true
          }
          trap restore_remote EXIT
          trap 'exit 130' INT TERM
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push origin HEAD:main; then
            # 人手のコミットと競合した場合。--autostash は、対象外パスに残った
            # 変更で rebase が止まるのを防ぐための保険。
            echo "push が拒否されました。rebase して 1 回だけ再試行します。"
            git pull --rebase --autostash origin main

            # rebase で自分のコミットが空になった（同じ変更が既に main にある）場合。
            # remote URL は EXIT trap が戻す。
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
              echo "rebase の結果 main と同一になりました。push は不要です。"
              exit 0
            fi

            # FETCH_HEAD は rebase の土台になった main の先端
            verify_tree FETCH_HEAD
            git push origin HEAD:main
          fi
          # output を書く前に明示的に戻す（EXIT trap でもう一度呼ばれても害は無い）
          restore_remote

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # 差分ゼロの実行では何も残らないため、失敗したときこそ中身が要る。
      # if: always() で必ず上げる（bot/.out は gitignore 下）。
      # include-hidden-files が必須。`.out` は名前が `.` で始まる隠しディレクトリで、
      # upload-artifact の既定（隠しファイルを含めない）では中身ごと除外され、
      # 2026-11-02 まで成果物が 1 件も保存されていなかった（ログに「No files were found」）。
      # 対象は bot/.out/** に限ったままなので、.git などほかの隠しファイルは含まれない。
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timetable-sync-out
          path: bot/.out/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # 送るかどうか・件名・本文を決める。Bot が途中で落ちて report.md が無い場合も
      # 実行ログへの導線だけは必ず出す（無言で失敗させない）。
      - name: Compose notification
        id: mail
        # cancelled() を除くのは、人が手で止めた実行で ❌ メールを飛ばさないため。
        # ジョブごと強制終了された場合はこのステップも走らないので、
        # そこは GitHub 標準の失敗通知が受け持つ。
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          HAS_WARN: ${{ steps.sync.outputs.has_warn }}
          DATA_CHANGED: ${{ steps.diff.outputs.data_changed }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p bot/.out
          body=bot/.out/mail-body.md
          stamp=$(date '+%Y-%m-%d %H:%M JST')
          short=$(date '+%m-%d')

          failed=no
          if [ "$SYNC_OUTCOME" != "success" ] || [ "$VALIDATE_OUTCOME" = "failure" ] || [ "$PUSH_OUTCOME" = "failure" ]; then
            failed=yes
          fi

          if [ "$failed" = "yes" ]; then
            send=yes
            subject="❌ [campus-bus-navi] 自動取得に失敗しました (${short})"
            headline="❌ 失敗しました。**本番（main）へは反映されていません**。アプリは前の状態のままです。"
          elif [ "$DATA_CHANGED" = "true" ] && [ "$HAS_WARN" = "true" ]; then
            send=yes
            subject="⚠ [campus-bus-navi] 時刻表を更新しました／要確認あり (${short})"
            headline="時刻表を更新して本番へ反映しました。**確認が必要な項目があります**（下の「⚠ 要手動確認」）。"
          elif [ "$DATA_CHANGED" = "true" ]; then
            send=yes
            subject="[campus-bus-navi] 時刻表を更新しました (${short})"
            headline="時刻表を更新して本番へ反映しました。内容に問題がなければ、何もする必要はありません。"
          elif [ "$HAS_WARN" = "true" ]; then
            send=yes
            subject="⚠ [campus-bus-navi] 要確認 (${short})"
            headline="時刻表そのものに変更はありませんでしたが、**確認が必要な項目があります**（読み取れない掲示が残っているなど）。"
          elif [ "$(date '+%d')" = "01" ]; then
            # 月次の稼働確認（heartbeat）。変更が無い日は何も残らないため、
            # スケジュールが止まっていること（60 日コミットが無いと GitHub が
            # 自動 Disable する等）を無期限に見逃してしまう。月 1 通だけ届かせる。
            send=yes
            subject="[campus-bus-navi] 稼働確認 (${short})"
            headline="変更はありませんでした。これは**日次実行が動いていることを確かめるための月次の稼働確認**です。届かない月が続いたら、Actions で有効状態を確認してください。"
          else
            send=no
            subject=""
            headline=""
          fi

          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          if [ "$send" = "no" ]; then
            echo "通知条件に該当しないためメールは送りません。"
            exit 0
          fi

          {
            echo "# 🤖 スクールバス時刻表の自動取り込み"
            echo
            echo "$headline"
            echo
            echo "- 実行日時: ${stamp}"
            echo "- 実行ログ: ${RUN_URL}"
            if [ -n "$COMMIT_SHA" ]; then
              echo "- 反映コミット: ${REPO_URL}/commit/${COMMIT_SHA}"
            fi
            echo
            echo "---"
            echo
          } > "$body"

          if [ -f bot/.out/report.md ]; then
            cat bot/.out/report.md >> "$body"
          else
            {
              echo "## 詳細"
              echo
              echo "実行レポートが生成される前に処理が終了しました。"
              echo "上の実行ログと、成果物 \`timetable-sync-out\` を確認してください。"
              echo
            } >> "$body"
          fi

          echo "件名: $subject"

      - name: Send notification
        if: ${{ !cancelled() && steps.mail.outputs.send == 'yes' }}
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: campus-bus-navi bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://bot/.out/mail-body.md
          convert_markdown: true
